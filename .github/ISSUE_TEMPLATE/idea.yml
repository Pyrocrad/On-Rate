name: Idea
description: Suggest something On Rate could do
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you trying to find out or do?
      description: The problem matters more than the solution. On Rate aims to stay accurate, neutral and honest about randomness.
